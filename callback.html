<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memizer — TikTok callback</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         max-width:680px;margin:48px auto;padding:0 20px;line-height:1.6;color:#111;text-align:center}
    #code{font-size:14px;word-break:break-all;background:#f4f4f5;border:1px solid #ddd;
          border-radius:10px;padding:16px;margin:18px 0;user-select:all}
    button{font-size:16px;padding:12px 22px;border:0;border-radius:10px;background:#0a66ff;
           color:#fff;cursor:pointer}
    .ok{color:#127a2b} .err{color:#b00020}
  </style>
</head>
<body>
  <h2>Codice di autorizzazione TikTok</h2>
  <p>Copia il codice qui sotto e incollalo nella chat con l'assistente.</p>
  <div id="code">…</div>
  <button onclick="copy()">Copia il codice</button>
  <p id="msg"></p>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code');
    const err = p.get('error') || p.get('error_description');
    const el = document.getElementById('code');
    if (code) { el.textContent = code; }
    else { el.textContent = 'ERRORE: ' + (err || 'nessun codice ricevuto'); el.classList.add('err'); }
    function copy(){
      if(!code) return;
      navigator.clipboard.writeText(code).then(()=>{
        document.getElementById('msg').textContent = 'Copiato ✓';
        document.getElementById('msg').className = 'ok';
      });
    }
  </script>
</body>
</html>
